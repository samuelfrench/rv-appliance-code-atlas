# Old URLs merged into model pages and troubleshooting hubs (generated by scripts/generate-static.mjs).
map_hash_max_size 16384;
map_hash_bucket_size 256;

map $uri $rv_redirect {
  default "";
  include /etc/nginx/rv-redirects.map;
}

server {
  listen 8080;
  server_name www.rvappliancefaultcodes.com;
  return 301 https://rvappliancefaultcodes.com$request_uri;
}

server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Relative Location headers: the container listens on 8080 behind Fly's HTTPS proxy.
  absolute_redirect off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  if ($rv_redirect) {
    return 301 https://rvappliancefaultcodes.com$rv_redirect;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  location ~* \.(?:js|css|jpg|jpeg|png|webp|svg|ico)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  location = /sitemap.xml { try_files $uri =404; }
  location = /feed.xml { try_files $uri =404; }
  location = /robots.txt { try_files $uri =404; }
  location = /indexnow-report.json { try_files $uri =404; }
  location = /corpus-stats.json { try_files $uri =404; }

  # Unknown paths are real 404s (the app shell in 404.html shows "Code not verified yet").
  location / {
    try_files $uri $uri/ =404;
  }
}
