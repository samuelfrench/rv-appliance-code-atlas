name: Deploy to Fly

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'TODO*'
      - 'scripts/seo/**'
      - 'scripts/todo/**'
      - '.github/workflows/todo.yml'
      - 'scripts/browser-acceptance/**'
      - '.github/workflows/browser-acceptance.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: rv-appliance-code-atlas-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run validate:corpus
      - run: npm run seo:self-check
      - run: npm run test:unit
      # build = tsc + vite + generate-static (latest links from the live /seo/content-dates.json, fallback
      # seo/content-dates.seed.json) + seo:finalize (ledger, sitemap lastmod, guard). The Fly Docker build repeats it.
      - run: npm run build
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
